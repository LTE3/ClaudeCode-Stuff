<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c090b">
<title>La Casita BK — Weekend</title>
<style>
  /* Scene: club manager glancing at weekend heads + cash on their phone, mid-shift,
     dim venue. Dark by necessity, number-first, hairline sections. Product register. */
  :root {
    --bg:        #0c090b;
    --surface:   #151013;
    --surface-2: #1c1519;
    --line:      #271f25;
    --line-2:    #3a2c34;
    --hi:        #f6eef2;   /* off-white, tinted warm — never #fff */
    --mid:       #b4a7ae;
    --dim:       #7c7077;
    --pink:      #ff4f8f;   /* brand accent — used sparingly */
    --money:     #59d2a0;   /* semantic positive, money only */

    --e-out: cubic-bezier(0.23, 1, 0.32, 1);
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); }
  body {
    color: var(--hi);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 22px 18px 72px; }

  /* ---------- header ---------- */
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .brand { font-size: 15px; font-weight: 700; letter-spacing: .14em; color: var(--pink); }
  .brand span { color: var(--dim); font-weight: 600; }
  .live { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--money); }

  /* ---------- gate ---------- */
  #gate { max-width: 320px; margin: 72px auto 0; }
  #gate p { color: var(--mid); font-size: 14px; margin: 0 0 14px; text-align: center; }
  #pin {
    width: 100%; padding: 14px 16px; font-size: 16px; font-family: var(--mono);
    letter-spacing: .12em; text-align: center; color: var(--hi);
    background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px;
    transition: border-color 160ms var(--e-out);
  }
  #pin:focus { outline: none; border-color: var(--pink); }
  .btn {
    width: 100%; margin-top: 12px; padding: 14px; font-size: 15px; font-weight: 650;
    font-family: var(--sans); color: #1a0a12; background: var(--pink);
    border: none; border-radius: 12px; cursor: pointer;
    transition: transform 140ms var(--e-out), filter 140ms var(--e-out);
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.975); }
  #gateErr { min-height: 18px; margin-top: 10px; text-align: center; font-size: 13px; color: #ff6b6b; }

  /* ---------- summary ---------- */
  .summary { margin-top: 26px; }
  .summary .heads {
    font-family: var(--mono); font-size: 64px; font-weight: 600; line-height: .92;
    letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--hi);
  }
  .summary .heads-label { font-size: 13px; color: var(--dim); margin-top: 4px; letter-spacing: .02em; }
  .summary .strip {
    display: flex; gap: 26px; margin-top: 18px; padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .summary .strip div { display: flex; flex-direction: column; }
  .strip .v { font-family: var(--mono); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .strip .k { font-size: 11px; color: var(--dim); margin-top: 3px; text-transform: uppercase; letter-spacing: .08em; }
  .money { color: var(--money); }

  /* ---------- per-night section ---------- */
  .night { margin-top: 34px; }
  .night-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .night-day { font-size: 20px; font-weight: 680; letter-spacing: -.01em; }
  .night-date { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .night-heads {
    font-family: var(--mono); font-size: 34px; font-weight: 600; line-height: 1;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  .night-heads small { display: block; text-align: right; font-family: var(--sans); font-size: 11px; font-weight: 500; color: var(--dim); letter-spacing: .04em; margin-top: 3px; }

  .stats { margin-top: 16px; border-top: 1px solid var(--line); }
  .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .stat .k { font-size: 14px; color: var(--mid); }
  .stat .v { font-family: var(--mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.total .k { color: var(--hi); font-weight: 600; }
  .stat.total .v { font-size: 16px; }

  /* table reservations */
  .tables { margin-top: 18px; }
  .tables-h { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
  .res { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .res:first-of-type { border-top: none; }
  .res-name { font-size: 15px; font-weight: 600; color: var(--hi); }
  .res-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .res-amt { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--money); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- footer ---------- */
  .foot { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .foot .stamp { font-size: 12px; color: var(--dim); }
  .refresh {
    font-family: var(--sans); font-size: 13px; color: var(--mid); background: transparent;
    border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 14px; cursor: pointer;
    transition: transform 140ms var(--e-out), border-color 140ms var(--e-out);
  }
  .refresh:hover { border-color: var(--pink); }
  .refresh:active { transform: scale(.975); }

  .hidden { display: none !important; }

  /* ---------- motion ---------- */
  .rise { opacity: 0; transform: translateY(10px); animation: rise 460ms var(--e-out) forwards; animation-delay: calc(var(--i, 0) * 50ms); }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .dot { animation: blink 2.4s var(--e-out) infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; opacity: 1; transform: none; }
    .dot { animation: none; }
    .btn:active, .refresh:active { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">LA CASITA BK <span>/ Weekend</span></div>
    <div id="liveTag" class="live hidden"><span class="dot"></span><span id="stamp">live</span></div>
  </div>

  <!-- passcode gate -->
  <div id="gate">
    <p>Enter passcode</p>
    <input id="pin" type="password" inputmode="text" autocomplete="off" placeholder="passcode" />
    <button class="btn" onclick="enter()">View numbers</button>
    <div id="gateErr"></div>
  </div>

  <!-- content -->
  <div id="app" class="hidden"></div>

  <div id="foot" class="foot hidden">
    <span class="stamp">Auto-refreshes every 10 min</span>
    <button class="refresh" onclick="load()">Refresh</button>
  </div>

</div>

<script>
const FN = "https://tqeunmqnaoyrerkbhokk.supabase.co/functions/v1/weekend-dashboard";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxZXVubXFuYW95cmVya2Job2trIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4OTQ1MzQsImV4cCI6MjA4OTQ3MDUzNH0.hkkuc7_YE2yf0w0NQENpahAxqxxqBfjq8n5QhtTIkw8";

let PIN = sessionStorage.getItem("lc_pin") || "";
let timer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = n => "$" + Math.round(n || 0).toLocaleString("en-US");

function fmtAgo(iso) {
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 45) return "live, just now";
  if (s < 3600) return "updated " + Math.round(s / 60) + " min ago";
  return "updated " + Math.round(s / 3600) + " hr ago";
}

function enter() {
  PIN = $("pin").value.trim();
  if (!PIN) { $("gateErr").textContent = "Enter the passcode."; return; }
  load(true);
}
$("pin").addEventListener("keydown", e => { if (e.key === "Enter") enter(); });

async function load(fromGate) {
  try {
    const r = await fetch(FN, {
      method: "POST",
      headers: { "Authorization": "Bearer " + ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ pin: PIN }),
    });
    if (r.status === 401) {
      sessionStorage.removeItem("lc_pin");
      if (fromGate) $("gateErr").textContent = "Wrong passcode.";
      else showGate();
      return;
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    sessionStorage.setItem("lc_pin", PIN);
    render(d);
  } catch (e) {
    if (fromGate) $("gateErr").textContent = "Could not load. Try again.";
  }
}

function showGate() {
  $("gate").classList.remove("hidden");
  $("app").classList.add("hidden");
  $("foot").classList.add("hidden");
  $("liveTag").classList.add("hidden");
}

function render(d) {
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("foot").classList.remove("hidden");
  $("liveTag").classList.remove("hidden");

  const t = d.totals;
  const ticketRev = (d.events || []).reduce((a, e) => a + (e.paid_net || 0), 0);
  const totalRev = ticketRev + (t.table_rev || 0);
  let i = 0; // stagger index

  let html = `
    <div class="summary rise" style="--i:${i++}">
      <div class="heads">${t.headcount}</div>
      <div class="heads-label">heads confirmed this weekend</div>
      <div class="strip">
        <div><span class="v">${t.free}</span><span class="k">Free RSVPs</span></div>
        <div><span class="v">${t.paid_tickets}</span><span class="k">Paid</span></div>
        <div><span class="v money">${money(totalRev)}</span><span class="k">Revenue</span></div>
      </div>
    </div>`;

  for (const e of (d.events || [])) {
    const dt = new Date(e.date + "T12:00:00");
    const dayName = dt.toLocaleDateString("en-US", { weekday: "long" });
    const dateStr = dt.toLocaleDateString("en-US", { month: "long", day: "numeric" });
    const rev = (e.paid_net || 0) + (e.table_rev || 0);

    let resBlock = "";
    if ((e.table_list || []).length) {
      const rows = e.table_list.map(tb => `
        <div class="res">
          <div>
            <div class="res-name">${esc(tb.name)}</div>
            <div class="res-sub">${esc(tb.type)}${tb.slot ? " · " + esc(tb.slot) : ""}${tb.party ? " · party " + tb.party : ""}</div>
          </div>
          <div class="res-amt">${money(tb.amount)}</div>
        </div>`).join("");
      resBlock = `<div class="tables"><div class="tables-h">Table reservations</div>${rows}</div>`;
    }

    html += `
      <div class="night rise" style="--i:${i++}">
        <div class="night-head">
          <div>
            <div class="night-day">${dayName}</div>
            <div class="night-date">${dateStr}</div>
          </div>
          <div class="night-heads">${e.headcount}<small>heads</small></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="k">Free, dance GA</span><span class="v">${e.free_ga}</span></div>
          <div class="stat"><span class="k">Free, ladies</span><span class="v">${e.free_ladies}</span></div>
          <div class="stat"><span class="k">Paid tickets</span><span class="v">${e.paid_tickets}</span></div>
          <div class="stat"><span class="k">Ticket revenue</span><span class="v money">${money(e.paid_net)}</span></div>
          <div class="stat"><span class="k">Tables</span><span class="v">${e.tables}</span></div>
          <div class="stat total"><span class="k">Total revenue</span><span class="v money">${money(rev)}</span></div>
        </div>
        ${resBlock}
      </div>`;
  }

  $("app").innerHTML = html;
  $("stamp").textContent = fmtAgo(d.generated_at);

  clearInterval(timer);
  timer = setInterval(load, 600000); // 10 min
}

if (PIN) load();
</script>
</body>
</html>
