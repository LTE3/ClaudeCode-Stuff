<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/admin/manifest.json">
<link rel="apple-touch-icon" href="/admin/icon-192.png">
<title>La Casita</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: -apple-system, sans-serif; min-height: 100vh; min-height: 100dvh; }

  /* PIN Screen */
  .pin-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 20px; }
  .pin-logo { font-size: 24px; font-weight: 800; letter-spacing: 6px; color: #FF4D8D; margin-bottom: 8px; }
  .pin-sub { font-size: 11px; color: #444; letter-spacing: 3px; margin-bottom: 40px; }
  .pin-dots { display: flex; gap: 16px; margin-bottom: 30px; }
  .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #333; }
  .pin-dot.filled { background: #FF4D8D; border-color: #FF4D8D; }
  .pin-dot.wrong { background: #f87171; border-color: #f87171; animation: shake 0.3s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 80px); gap: 12px; }
  .pin-key { width: 80px; height: 60px; background: #111; border: 1px solid #222; border-radius: 12px; font-size: 24px; font-weight: 600; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .pin-key:active { background: #222; }
  .pin-key.del { font-size: 14px; color: #888; }
  .pin-error { color: #f87171; font-size: 12px; margin-top: 16px; letter-spacing: 1px; min-height: 18px; }

  /* Dashboard */
  .dashboard { display: none; min-height: 100vh; min-height: 100dvh; }
  .dash-header { background: linear-gradient(135deg, #FF4D8D, #FF6B9D); padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; }
  .dash-header h1 { font-size: 16px; letter-spacing: 4px; }
  .dash-header .logout { padding: 6px 14px; background: rgba(255,255,255,0.2); color: #fff; border: none; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; letter-spacing: 1px; }
  .dash-role { padding: 12px 20px; background: #111; border-bottom: 1px solid #1a1a1a; }
  .dash-role span { font-size: 11px; color: #FF4D8D; letter-spacing: 3px; font-weight: 700; }
  .dash-grid { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dash-card { background: #111; border: 1px solid #222; border-radius: 14px; padding: 24px 16px; text-align: center; cursor: pointer; text-decoration: none; }
  .dash-card:active { background: #1a1a1a; border-color: #FF4D8D40; }
  .dash-card .dc-icon { font-size: 28px; margin-bottom: 10px; }
  .dash-card .dc-title { font-size: 14px; font-weight: 700; color: #eee; letter-spacing: 1px; }
  .dash-card .dc-desc { font-size: 10px; color: #555; margin-top: 6px; letter-spacing: 1px; }
  .dash-card.wide { grid-column: span 2; }

  /* Settings */
  .settings { padding: 16px; border-top: 1px solid #151515; margin-top: 8px; }
  .settings h3 { font-size: 11px; color: #444; letter-spacing: 3px; margin-bottom: 12px; }
  .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #111; }
  .setting-row .sl { font-size: 13px; color: #888; }
  .setting-row input { width: 80px; padding: 6px; background: #111; color: #FF4D8D; border: 1px solid #222; border-radius: 6px; text-align: center; font-size: 14px; font-weight: 700; }
  .setting-row button { padding: 6px 14px; background: #222; color: #aaa; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>

<div class="pin-screen" id="pinScreen">
  <div class="pin-logo">LA CASITA</div>
  <div class="pin-sub">STAFF APP</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
  </div>
  <div class="pin-pad">
    <div class="pin-key" onclick="pressKey('1')">1</div>
    <div class="pin-key" onclick="pressKey('2')">2</div>
    <div class="pin-key" onclick="pressKey('3')">3</div>
    <div class="pin-key" onclick="pressKey('4')">4</div>
    <div class="pin-key" onclick="pressKey('5')">5</div>
    <div class="pin-key" onclick="pressKey('6')">6</div>
    <div class="pin-key" onclick="pressKey('7')">7</div>
    <div class="pin-key" onclick="pressKey('8')">8</div>
    <div class="pin-key" onclick="pressKey('9')">9</div>
    <div class="pin-key" style="visibility:hidden"></div>
    <div class="pin-key" onclick="pressKey('0')">0</div>
    <div class="pin-key del" onclick="pressDelete()">DEL</div>
  </div>
  <div class="pin-error" id="pinError"></div>
</div>

<div class="dashboard" id="dashboard"></div>

<script>
const MANAGER_PIN_KEY = 'lc_manager_pin';
const STAFF_PIN_KEY = 'lc_staff_pin';

function getManagerPin() { return localStorage.getItem(MANAGER_PIN_KEY) || '2121'; }
function getStaffPin() { return localStorage.getItem(STAFF_PIN_KEY) || '0000'; }

let currentPin = '';
let currentRole = null;

function pressKey(n) {
  if (currentPin.length >= 4) return;
  currentPin += n;
  updateDots();
  if (currentPin.length === 4) {
    setTimeout(checkPin, 200);
  }
}

function pressDelete() {
  currentPin = currentPin.slice(0, -1);
  updateDots();
  document.getElementById('pinError').textContent = '';
}

function updateDots() {
  const dots = document.querySelectorAll('.pin-dot');
  dots.forEach((d, i) => {
    d.className = 'pin-dot' + (i < currentPin.length ? ' filled' : '');
  });
}

function checkPin() {
  if (currentPin === getManagerPin()) {
    currentRole = 'manager';
    showDashboard();
  } else if (currentPin === getStaffPin()) {
    currentRole = 'staff';
    showDashboard();
  } else {
    document.querySelectorAll('.pin-dot').forEach(d => d.className = 'pin-dot wrong');
    document.getElementById('pinError').textContent = 'WRONG PIN';
    setTimeout(() => {
      currentPin = '';
      updateDots();
      document.getElementById('pinError').textContent = '';
    }, 800);
  }
}

function showDashboard() {
  document.getElementById('pinScreen').style.display = 'none';
  const dash = document.getElementById('dashboard');
  dash.style.display = 'block';

  if (currentRole === 'manager') {
    dash.innerHTML = `
      <div class="dash-header">
        <h1>LA CASITA</h1>
        <button class="logout" onclick="doLogout()">LOCK</button>
      </div>
      <div class="dash-role"><span>MANAGER</span></div>
      <div class="dash-grid">
        <a class="dash-card" href="pos.html">
          <div class="dc-icon">$</div>
          <div class="dc-title">POS</div>
          <div class="dc-desc">CHARGE / QR / CASH</div>
        </a>
        <a class="dash-card" href="tips.html">
          <div class="dc-icon">#</div>
          <div class="dc-title">TIPS</div>
          <div class="dc-desc">LIVE TIP POOL</div>
        </a>
        <a class="dash-card" href="tipsheet.html">
          <div class="dc-icon">%</div>
          <div class="dc-title">TIP SHEET</div>
          <div class="dc-desc">SPLIT CALCULATOR</div>
        </a>
        <a class="dash-card" href="clockin.html">
          <div class="dc-icon">&gt;</div>
          <div class="dc-title">CLOCK IN</div>
          <div class="dc-desc">TIME TRACKING</div>
        </a>
        <a class="dash-card" href="staff.html">
          <div class="dc-icon">@</div>
          <div class="dc-title">STAFF</div>
          <div class="dc-desc">ROSTER + SCHEDULE</div>
        </a>
        <a class="dash-card" href="portal.html">
          <div class="dc-icon">&</div>
          <div class="dc-title">PORTAL</div>
          <div class="dc-desc">STAFF VIEW</div>
        </a>
        <a class="dash-card" href="door.html">
          <div class="dc-icon">~</div>
          <div class="dc-title">DOOR</div>
          <div class="dc-desc">TICKET QR CODES</div>
        </a>
        <a class="dash-card" href="index.html">
          <div class="dc-icon">*</div>
          <div class="dc-title">ADMIN</div>
          <div class="dc-desc">FULL DASHBOARD</div>
        </a>
      </div>
      <div class="settings">
        <h3>PIN SETTINGS</h3>
        <div class="setting-row">
          <span class="sl">Manager PIN</span>
          <div><input id="mgrPin" value="${getManagerPin()}" maxlength="4" /><button onclick="savePin('manager')">SAVE</button></div>
        </div>
        <div class="setting-row">
          <span class="sl">Staff PIN</span>
          <div><input id="stfPin" value="${getStaffPin()}" maxlength="4" /><button onclick="savePin('staff')">SAVE</button></div>
        </div>
      </div>
    `;
  } else {
    dash.innerHTML = `
      <div class="dash-header">
        <h1>LA CASITA</h1>
        <button class="logout" onclick="doLogout()">LOCK</button>
      </div>
      <div class="dash-role"><span>STAFF</span></div>
      <div class="dash-grid">
        <a class="dash-card wide" href="portal.html">
          <div class="dc-icon">&</div>
          <div class="dc-title">MY PAY + SHIFTS</div>
          <div class="dc-desc">VIEW PAY HISTORY, SHIFTS, SCHEDULE</div>
        </a>
        <a class="dash-card" href="clockin.html">
          <div class="dc-icon">&gt;</div>
          <div class="dc-title">CLOCK IN</div>
          <div class="dc-desc">START / END SHIFT</div>
        </a>
        <a class="dash-card" href="portal.html">
          <div class="dc-icon">#</div>
          <div class="dc-title">SCHEDULE</div>
          <div class="dc-desc">UPCOMING SHIFTS</div>
        </a>
      </div>
    `;
  }
}

function savePin(type) {
  if (type === 'manager') {
    const val = document.getElementById('mgrPin').value;
    if (val.length === 4) localStorage.setItem(MANAGER_PIN_KEY, val);
  } else {
    const val = document.getElementById('stfPin').value;
    if (val.length === 4) localStorage.setItem(STAFF_PIN_KEY, val);
  }
}

function doLogout() {
  currentPin = '';
  currentRole = null;
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('pinScreen').style.display = 'flex';
  updateDots();
}

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/admin/sw.js');
}
</script>
</body>
</html>
