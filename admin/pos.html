<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>La Casita POS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: -apple-system, sans-serif; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #FF2D8B, #FF6AD5); padding: 16px; text-align: center; }
  .header h1 { font-size: 18px; letter-spacing: 3px; }
  .reader-select { padding: 12px; background: #111; border-bottom: 1px solid #222; }
  .reader-select select { width: 100%; padding: 10px; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 8px; font-size: 16px; }
  .menu { padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .menu-item { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 20px 12px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .menu-item:active { transform: scale(0.95); background: #252525; }
  .menu-item .name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .menu-item .price { font-size: 22px; font-weight: 700; color: #FFD34D; }
  .menu-item .qty-badge { display: inline-block; background: #FF2D8B; color: #fff; border-radius: 50%; width: 24px; height: 24px; line-height: 24px; font-size: 13px; font-weight: 700; margin-top: 6px; }
  .cart { padding: 12px; border-top: 1px solid #222; background: #111; }
  .cart h3 { font-size: 14px; color: #888; margin-bottom: 8px; letter-spacing: 1px; }
  .cart-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .cart-item .remove { color: #FF2D8B; cursor: pointer; margin-left: 8px; }
  .totals { padding: 12px; background: #111; border-top: 1px solid #222; }
  .total-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; color: #aaa; }
  .total-row.grand { font-size: 20px; font-weight: 700; color: #fff; padding: 8px 0; }
  .actions { padding: 12px; background: #111; }
  .charge-btn { width: 100%; padding: 16px; background: #FF2D8B; color: #fff; border: none; border-radius: 12px; font-size: 18px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
  .charge-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .charge-btn:active:not(:disabled) { background: #d4207a; }
  .clear-btn { width: 100%; padding: 12px; background: transparent; color: #888; border: 1px solid #333; border-radius: 12px; font-size: 14px; cursor: pointer; margin-top: 8px; }
  .status { padding: 12px; text-align: center; font-size: 14px; }
  .status.success { color: #34d399; }
  .status.error { color: #f87171; }
  .status.processing { color: #fbbf24; }
  .qr-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
  .qr-overlay .qr-box { background: #fff; padding: 20px; border-radius: 16px; margin-bottom: 20px; }
  .qr-overlay .qr-box img { width: 280px; height: 280px; }
  .qr-overlay .qr-total { font-size: 36px; font-weight: 700; color: #2DD4BF; margin-bottom: 12px; }
  .qr-overlay .qr-label { font-size: 16px; color: #aaa; margin-bottom: 24px; letter-spacing: 2px; }
  .qr-overlay .qr-close { padding: 14px 40px; background: #333; color: #fff; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; }
  .custom-amount { padding: 12px; }
  .custom-amount input { width: 100%; padding: 12px; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 8px; font-size: 18px; text-align: center; }
  .custom-amount button { width: 100%; padding: 10px; background: #333; color: #fff; border: none; border-radius: 8px; font-size: 14px; margin-top: 8px; cursor: pointer; }
  .mgr-bar { padding: 8px 12px; text-align: center; font-size: 12px; letter-spacing: 1px; cursor: pointer; }
  .mgr-bar.locked { background: #1a1a1a; color: #555; }
  .mgr-bar.unlocked { background: #FF2D8B; color: #fff; animation: mgr-pulse 2s infinite; }
  @keyframes mgr-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
</style>
</head>
<body>

<div class="header">
  <h1>LA CASITA POS</h1>
</div>
<a href="app.html" style="display:block;padding:8px;text-align:center;font-size:11px;color:#444;text-decoration:none;letter-spacing:2px;background:#050505;">← BACK TO APP</a>

<div class="reader-select">
  <select id="readerSelect">
    <option value="tmr_GfHNkQJenrFEdK">POS3</option>
    <option value="tmr_GfGuAiK0SPXHK3">POS 2</option>
    <option value="tmr_GfG68gbsEpD3Tl">POS1</option>
  </select>
</div>

<div id="statusBar" class="status" style="display:none;"></div>

<div class="menu" id="menuGrid"></div>

<div class="custom-amount">
  <input type="number" id="customAmount" placeholder="Custom amount $" step="0.01" min="0">
  <button onclick="addCustom()">Add Custom Item</button>
</div>

<div class="cart" id="cartSection" style="display:none;">
  <h3>ORDER</h3>
  <div id="cartItems"></div>
</div>

<div class="totals" id="totalsSection" style="display:none;">
  <div class="total-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
  <div class="total-row"><span>Tax (9%)</span><span id="tax">$0.00</span></div>
  <div class="total-row"><span>Service Charge (20%)</span><span id="serviceCharge">$0.00</span></div>
  <div class="total-row grand"><span>Total</span><span id="grandTotal">$0.00</span></div>
</div>

<div class="actions">
  <button class="charge-btn" id="chargeBtn" disabled onclick="charge()">CHARGE $0.00</button>
  <button class="charge-btn" id="qrBtn" disabled onclick="qrPay()" style="background:#2DD4BF;margin-top:8px;">QR PAY $0.00</button>
  <button class="charge-btn" id="cashBtn" disabled onclick="cashPay()" style="background:#34d399;margin-top:8px;">CASH $0.00</button>
  <button class="clear-btn" onclick="clearCart()">CLEAR ORDER</button>
  <button class="clear-btn" style="margin-top:8px;color:#f87171;border-color:#f87171/30;" onclick="voidPayment()">VOID / CANCEL TERMINAL</button>
</div>

<div id="mgrBar" class="mgr-bar locked" onclick="toggleManager()">🔒 MANAGER MODE — TAP TO UNLOCK</div>

<script>
const SUPABASE_URL = 'https://tqeunmqnaoyrerkbhokk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxZXVubXFuYW95cmVya2Job2trIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4OTQ1MzQsImV4cCI6MjA4OTQ3MDUzNH0.hkkuc7_YE2yf0w0NQENpahAxqxxqBfjq8n5QhtTIkw8';

const MENU = [
  // --- Drinks (service charge applies) ---
  { name: 'Nutcracker', amount: 1399 },
  { name: 'Nutcrackers 2/$20', amount: 2000 },
  { name: 'Rum Punch', amount: 1299 },
  { name: 'Margarita Classic', amount: 1599 },
  { name: 'Margarita Mango', amount: 1599 },
  { name: 'Margarita Strawberry', amount: 1599 },
  { name: 'Shot', amount: 899 },
  { name: 'Coca Cola', amount: 600 },
  { name: 'Redbull', amount: 1000 },
  { name: 'Water Bottle', amount: 200, noService: true },
  // --- Bottle Service / Hookah (no service charge) ---
  { name: 'Don Julio Bottle', amount: 20000 },
  { name: 'Bacardi Bottle', amount: 15000 },
  { name: 'Hookah', amount: 5000, noService: true },
  { name: 'Hookah Refill', amount: 2000, noService: true },
  // --- Door Tickets (no service charge) ---
  { name: 'Guys Ticket', amount: 3000, noService: true },
  { name: 'GA Ticket', amount: 2000, noService: true },
  { name: 'Girls Ticket', amount: 1000, noService: true },
];

let cart = [];
let managerMode = false;
let mgrTimeout = null;

function toggleManager() {
  if (managerMode) {
    lockManager();
    return;
  }
  const code = prompt('Enter 4-digit manager code:');
  if (code === '7742') {
    managerMode = true;
    document.getElementById('mgrBar').className = 'mgr-bar unlocked';
    document.getElementById('mgrBar').textContent = '🔓 MANAGER MODE ACTIVE — 2:00';
    resetMgrTimeout();
  } else {
    const status = document.getElementById('statusBar');
    status.style.display = 'block';
    status.className = 'status error';
    status.textContent = 'Invalid manager code.';
    setTimeout(() => { status.style.display = 'none'; }, 3000);
  }
}

function lockManager() {
  managerMode = false;
  clearInterval(mgrTimeout);
  document.getElementById('mgrBar').className = 'mgr-bar locked';
  document.getElementById('mgrBar').textContent = '🔒 MANAGER MODE — TAP TO UNLOCK';
}

function resetMgrTimeout() {
  clearInterval(mgrTimeout);
  let remaining = 120;
  document.getElementById('mgrBar').textContent = '🔓 MANAGER MODE ACTIVE — 2:00';
  mgrTimeout = setInterval(() => {
    remaining--;
    const m = Math.floor(remaining / 60);
    const s = String(remaining % 60).padStart(2, '0');
    document.getElementById('mgrBar').textContent = '🔓 MANAGER MODE ACTIVE — ' + m + ':' + s;
    if (remaining <= 0) lockManager();
  }, 1000);
}

function requireManager() {
  if (managerMode) { resetMgrTimeout(); return true; }
  const code = prompt('Enter 4-digit manager code:');
  if (code === '7742') return true;
  const status = document.getElementById('statusBar');
  status.style.display = 'block';
  status.className = 'status error';
  status.textContent = 'Invalid manager code.';
  setTimeout(() => { status.style.display = 'none'; }, 3000);
  return false;
}

function renderMenu() {
  const grid = document.getElementById('menuGrid');
  grid.innerHTML = MENU.map(item => {
    const inCart = cart.filter(c => c.name === item.name).length;
    return `<div class="menu-item" onclick="addItem('${item.name}', ${item.amount})">
      <div class="name">${item.name}</div>
      <div class="price">$${(item.amount / 100).toFixed(2)}</div>
      ${inCart ? `<div class="qty-badge">${inCart}</div>` : ''}
    </div>`;
  }).join('');
}

function addItem(name, amount) {
  cart.push({ name, amount, qty: 1 });
  updateUI();
}

function addCustom() {
  if (!requireManager()) return;
  const input = document.getElementById('customAmount');
  const val = parseFloat(input.value);
  if (!val || val <= 0) return;
  cart.push({ name: 'Custom', amount: Math.round(val * 100), qty: 1 });
  input.value = '';
  updateUI();
}

function removeItem(idx) {
  cart.splice(idx, 1);
  updateUI();
}

function updateUI() {
  renderMenu();
  const cartSection = document.getElementById('cartSection');
  const totalsSection = document.getElementById('totalsSection');
  const cartItems = document.getElementById('cartItems');
  const chargeBtn = document.getElementById('chargeBtn');

  const qrBtn = document.getElementById('qrBtn');
  const cashBtn = document.getElementById('cashBtn');

  if (cart.length === 0) {
    cartSection.style.display = 'none';
    totalsSection.style.display = 'none';
    chargeBtn.disabled = true;
    chargeBtn.textContent = 'CHARGE $0.00';
    qrBtn.disabled = true;
    qrBtn.textContent = 'QR PAY $0.00';
    cashBtn.disabled = true;
    cashBtn.textContent = 'CASH $0.00';
    return;
  }

  cartSection.style.display = 'block';
  totalsSection.style.display = 'block';

  cartItems.innerHTML = cart.map((item, i) =>
    `<div class="cart-item"><span>${item.name} — $${(item.amount / 100).toFixed(2)}</span><span class="remove" onclick="removeItem(${i})">✕</span></div>`
  ).join('');

  const subtotal = cart.reduce((s, i) => s + i.amount, 0);
  const serviceBase = cart.filter(i => !i.noService).reduce((s, i) => s + i.amount, 0);
  const tax = Math.round(subtotal * 0.09);
  const service = Math.round(serviceBase * 0.20);
  const total = subtotal + tax + service;

  document.getElementById('subtotal').textContent = '$' + (subtotal / 100).toFixed(2);
  document.getElementById('tax').textContent = '$' + (tax / 100).toFixed(2);
  document.getElementById('serviceCharge').textContent = '$' + (service / 100).toFixed(2);
  document.getElementById('grandTotal').textContent = '$' + (total / 100).toFixed(2);

  chargeBtn.disabled = false;
  chargeBtn.textContent = `CHARGE $${(total / 100).toFixed(2)}`;
  qrBtn.disabled = false;
  qrBtn.textContent = `QR PAY $${(total / 100).toFixed(2)}`;
  cashBtn.disabled = false;
  cashBtn.textContent = `CASH $${(total / 100).toFixed(2)}`;
}

async function charge() {
  const btn = document.getElementById('chargeBtn');
  const status = document.getElementById('statusBar');
  const readerId = document.getElementById('readerSelect').value;

  btn.disabled = true;
  btn.textContent = 'SENDING TO READER...';
  status.style.display = 'block';
  status.className = 'status processing';
  status.textContent = 'Sending payment to terminal...';

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/terminal-payment`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({ reader_id: readerId, items: cart }),
    });
    const data = await res.json();

    if (data.error) {
      status.className = 'status error';
      status.textContent = 'Error: ' + data.error;
      btn.disabled = false;
      btn.textContent = `CHARGE $${((cart.reduce((s,i) => s + i.amount, 0) * 1.29) / 100).toFixed(2)}`;
    } else {
      status.className = 'status success';
      status.textContent = `Sent! Total: $${(data.total / 100).toFixed(2)} (incl. $${(data.service_charge / 100).toFixed(2)} service charge)`;
      cart = [];
      updateUI();
      setTimeout(() => { status.style.display = 'none'; }, 5000);
    }
  } catch (err) {
    status.className = 'status error';
    status.textContent = 'Network error: ' + err.message;
    btn.disabled = false;
    btn.textContent = `CHARGE $${((cart.reduce((s,i) => s + i.amount, 0) * 1.29) / 100).toFixed(2)}`;
  }
}

function clearCart() {
  cart = [];
  updateUI();
  document.getElementById('statusBar').style.display = 'none';
}

async function voidPayment() {
  if (!requireManager()) return;
  const readerId = document.getElementById('readerSelect').value;
  const status = document.getElementById('statusBar');
  status.style.display = 'block';
  status.className = 'status processing';
  status.textContent = 'Canceling payment on terminal...';

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/terminal-payment`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({ reader_id: readerId, action: 'void' }),
    });
    const data = await res.json();
    if (data.error) {
      status.className = 'status error';
      status.textContent = data.error.message;
    } else {
      status.className = 'status success';
      status.textContent = 'Payment voided. Order kept.';

      setTimeout(() => { status.style.display = 'none'; }, 3000);
    }
  } catch (err) {
    status.className = 'status error';
    status.textContent = 'Error: ' + err.message;
  }
}

async function qrPay() {
  const btn = document.getElementById('qrBtn');
  const status = document.getElementById('statusBar');
  btn.disabled = true;
  btn.textContent = 'GENERATING QR...';
  status.style.display = 'block';
  status.className = 'status processing';
  status.textContent = 'Creating checkout link...';

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/terminal-payment`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({ items: cart, action: 'qr' }),
    });
    const data = await res.json();

    if (data.error) {
      status.className = 'status error';
      status.textContent = 'Error: ' + data.error;
      btn.disabled = false;
      updateUI();
    } else {
      status.style.display = 'none';
      const overlay = document.createElement('div');
      overlay.className = 'qr-overlay';
      overlay.innerHTML = `
        <div class="qr-total">$${(data.total / 100).toFixed(2)}</div>
        <div class="qr-label">SCAN TO PAY</div>
        <div class="qr-box">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(data.checkout_url)}" alt="QR Code">
        </div>
        <button class="qr-close" onclick="this.parentElement.remove()">DONE</button>
      `;
      document.body.appendChild(overlay);
      cart = [];
      updateUI();
    }
  } catch (err) {
    status.className = 'status error';
    status.textContent = 'Error: ' + err.message;
    btn.disabled = false;
    updateUI();
  }
}

async function cashPay() {
  const btn = document.getElementById('cashBtn');
  const status = document.getElementById('statusBar');
  btn.disabled = true;
  btn.textContent = 'LOGGING...';
  status.style.display = 'block';
  status.className = 'status processing';
  status.textContent = 'Recording cash payment...';

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/terminal-payment`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({ items: cart, action: 'cash' }),
    });
    const data = await res.json();

    if (data.error) {
      status.className = 'status error';
      status.textContent = 'Error: ' + data.error;
      btn.disabled = false;
      updateUI();
    } else {
      status.className = 'status success';
      status.textContent = 'Cash payment logged — $' + (data.total / 100).toFixed(2);
      cart = [];
      updateUI();
    }
  } catch (err) {
    status.className = 'status error';
    status.textContent = 'Error: ' + err.message;
    btn.disabled = false;
    updateUI();
  }
}

renderMenu();
</script>

</body>
</html>
