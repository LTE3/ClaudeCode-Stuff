<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Casita Clock In</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: -apple-system, sans-serif; min-height: 100vh; padding-bottom: 40px; }
  .header { background: linear-gradient(135deg, #FF4D8D, #FF6B9D); padding: 18px; text-align: center; }
  .header h1 { font-size: 18px; letter-spacing: 4px; }
  section { padding: 16px; border-bottom: 1px solid #151515; }
  section h2 { font-size: 12px; color: #666; letter-spacing: 3px; margin-bottom: 12px; }

  .clock-form { display: flex; flex-direction: column; gap: 10px; }
  .clock-form input, .clock-form select {
    padding: 14px; background: #111; color: #fff; border: 1px solid #222;
    border-radius: 10px; font-size: 16px;
  }
  .clock-in-btn {
    padding: 16px; background: #34d399; color: #fff; border: none;
    border-radius: 12px; font-size: 18px; font-weight: 700;
    letter-spacing: 2px; cursor: pointer;
  }
  .clock-in-btn:active { background: #2bb583; }

  .staff-card {
    background: #111; border: 1px solid #222; border-radius: 12px;
    padding: 14px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .staff-card .info .sname { font-size: 16px; font-weight: 700; color: #eee; }
  .staff-card .info .srole { font-size: 12px; color: #FF4D8D; margin-top: 2px; }
  .staff-card .info .stime { font-size: 11px; color: #555; margin-top: 4px; }
  .staff-card .right { text-align: right; }
  .staff-card .hours { font-size: 20px; font-weight: 800; color: #34d399; }
  .staff-card .status-on { font-size: 10px; color: #34d399; letter-spacing: 2px; }
  .staff-card .status-off { font-size: 10px; color: #555; letter-spacing: 2px; }

  .clock-out-btn {
    padding: 8px 16px; background: #FF4D8D; color: #fff; border: none;
    border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
    margin-top: 6px;
  }
  .clock-out-btn:active { background: #e0437a; }

  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .quick-btn { padding: 14px 10px; background: #111; border: 1px solid #222; border-radius: 10px; text-align: center; cursor: pointer; }
  .quick-btn:active { border-color: #34d399; background: #1a1a1a; }
  .quick-btn .qname { font-size: 15px; font-weight: 700; color: #eee; }
  .quick-btn .qrole { font-size: 11px; color: #FF4D8D; margin-top: 2px; }
  .quick-btn.clocked { opacity: 0.3; pointer-events: none; }
  .or-divider { text-align: center; color: #333; font-size: 11px; letter-spacing: 3px; margin: 12px 0; }

  .live-dot { display: inline-block; width: 8px; height: 8px; background: #34d399; border-radius: 50%; margin-right: 6px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .date-nav { display: flex; align-items: center; gap: 10px; justify-content: center; }
  .date-nav input { padding: 10px; background: #111; color: #fff; border: 1px solid #222; border-radius: 8px; font-size: 14px; }

  .summary-bar {
    display: flex; justify-content: space-around; padding: 14px;
    background: #111; border: 1px solid #222; border-radius: 12px; margin-bottom: 12px;
  }
  .summary-bar .sval { font-size: 20px; font-weight: 800; color: #FF4D8D; text-align: center; }
  .summary-bar .slabel { font-size: 9px; color: #555; letter-spacing: 2px; text-align: center; margin-top: 4px; }
</style>
</head>
<body>

<div class="header"><h1>LA CASITA CLOCK IN</h1></div>

<section>
  <h2>DATE</h2>
  <div class="date-nav">
    <input type="date" id="partyDate" onchange="loadRecords()" />
  </div>
</section>

<section>
  <h2>TAP TO CLOCK IN</h2>
  <div class="quick-grid" id="quickGrid"></div>
  <div class="or-divider">OR ADD MANUALLY</div>
  <div class="clock-form">
    <input type="text" id="staffName" placeholder="Name" />
    <select id="staffRole">
      <option value="Barback">Barback</option>
      <option value="Bartender">Bartender</option>
      <option value="Bottle Girl">Bottle Girl</option>
      <option value="Security">Security</option>
      <option value="DJ">DJ</option>
      <option value="Host">Host</option>
      <option value="Manager">Manager</option>
      <option value="Server">Server</option>
    </select>
    <button class="clock-in-btn" onclick="clockIn()">CLOCK IN</button>
  </div>
</section>

<section>
  <h2>STAFF ON SHIFT</h2>
  <div class="summary-bar" id="summaryBar">
    <div><div class="sval" id="onCount">0</div><div class="slabel">ON SHIFT</div></div>
    <div><div class="sval" id="totalCount">0</div><div class="slabel">TOTAL</div></div>
    <div><div class="sval" id="totalHours">0</div><div class="slabel">HOURS</div></div>
  </div>
  <div id="staffList"></div>
</section>

<script>
const SUPABASE_URL = 'https://tqeunmqnaoyrerkbhokk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxZXVubXFuYW95cmVya2Job2trIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4OTQ1MzQsImV4cCI6MjA4OTQ3MDUzNH0.hkkuc7_YE2yf0w0NQENpahAxqxxqBfjq8n5QhtTIkw8';

let records = [];
let staffList = [];

function getPartyDate() {
  const nowET = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  if (nowET.getHours() < 4) nowET.setDate(nowET.getDate() - 1);
  const yyyy = nowET.getFullYear();
  const mm = String(nowET.getMonth() + 1).padStart(2, '0');
  const dd = String(nowET.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

async function apiCall(body) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/terminal-payment`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
    body: JSON.stringify(body),
  });
  return res.json();
}

async function loadRecords() {
  const date = document.getElementById('partyDate').value;
  const data = await apiCall({ action: 'clock_records', party_date: date });
  records = data.records || [];
  renderStaff();
}

async function clockIn() {
  const name = document.getElementById('staffName').value.trim();
  const role = document.getElementById('staffRole').value;
  if (!name) return;

  await apiCall({
    action: 'clock_in',
    name, role,
    party_date: document.getElementById('partyDate').value,
  });

  document.getElementById('staffName').value = '';
  await loadRecords();
}

async function clockOut(id) {
  await apiCall({ action: 'clock_out', record_id: id });
  await loadRecords();
}

function renderStaff() {
  renderQuickGrid();
  const nowET = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const onShift = records.filter(r => !r.clock_out);
  const offShift = records.filter(r => r.clock_out);
  const totalHrs = records.reduce((s, r) => {
    if (r.hours) return s + parseFloat(r.hours);
    if (!r.clock_out) {
      const elapsed = (nowET.getTime() - new Date(r.clock_in).getTime()) / 1000 / 3600;
      return s + Math.round(elapsed * 2) / 2;
    }
    return s;
  }, 0);

  document.getElementById('onCount').textContent = onShift.length;
  document.getElementById('totalCount').textContent = records.length;
  document.getElementById('totalHours').textContent = totalHrs.toFixed(1);

  const fmt = (ts) => new Date(ts).toLocaleString('en-US', {
    timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit', hour12: true
  });

  const html = records.map(r => {
    const isOn = !r.clock_out;
    let hrs = r.hours ? parseFloat(r.hours).toFixed(1) : null;
    if (isOn) {
      const elapsed = (nowET.getTime() - new Date(r.clock_in).getTime()) / 1000 / 3600;
      hrs = (Math.round(elapsed * 2) / 2).toFixed(1);
    }

    return `<div class="staff-card">
      <div class="info">
        <div class="sname">${isOn ? '<span class="live-dot"></span>' : ''}${r.name}</div>
        <div class="srole">${r.role}</div>
        <div class="stime">In: ${fmt(r.clock_in)}${r.clock_out ? ' — Out: ' + fmt(r.clock_out) : ''}</div>
        ${isOn ? `<button class="clock-out-btn" onclick="clockOut('${r.id}')">CLOCK OUT</button>` : ''}
      </div>
      <div class="right">
        <div class="hours">${hrs}h</div>
        <div class="${isOn ? 'status-on' : 'status-off'}">${isOn ? 'ON SHIFT' : 'DONE'}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('staffList').innerHTML = html || '<div style="text-align:center;color:#444;padding:30px;font-size:13px;letter-spacing:2px;">NO STAFF CLOCKED IN</div>';
}

async function loadStaff() {
  const data = await apiCall({ action: 'get_staff' });
  staffList = (data.staff || []).filter(s => s.active !== false);
  renderQuickGrid();
}

function renderQuickGrid() {
  const clockedNames = records.filter(r => !r.clock_out).map(r => r.name);
  document.getElementById('quickGrid').innerHTML = staffList.map(s => {
    const clocked = clockedNames.includes(s.name);
    return `<div class="quick-btn${clocked ? ' clocked' : ''}" onclick="quickClockIn('${s.name}','${s.role}')">
      <div class="qname">${s.name}</div>
      <div class="qrole">${s.role}</div>
    </div>`;
  }).join('') || '';
}

async function quickClockIn(name, role) {
  await apiCall({
    action: 'clock_in',
    name, role,
    party_date: document.getElementById('partyDate').value,
  });
  await loadRecords();
}

// Set party date (4AM cutoff)
document.getElementById('partyDate').value = getPartyDate();
loadStaff();
loadRecords();

// Update live hours every 30 seconds
setInterval(() => renderStaff(), 30000);
</script>
</body>
</html>
