<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>La Casita Tip Sheet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: -apple-system, sans-serif; min-height: 100vh; padding-bottom: 40px; }
  .header { background: linear-gradient(135deg, #FF4D8D, #FF6B9D); padding: 18px; text-align: center; }
  .header h1 { font-size: 18px; letter-spacing: 4px; }
  section { padding: 16px; border-bottom: 1px solid #151515; }
  section h2 { font-size: 12px; color: #666; letter-spacing: 3px; margin-bottom: 12px; }
  .pool-input { display: flex; gap: 10px; align-items: center; }
  .pool-input input { flex: 1; padding: 14px; background: #111; color: #FF4D8D; border: 1px solid #222; border-radius: 10px; font-size: 28px; font-weight: 800; text-align: center; }
  .pool-input button { padding: 14px 16px; background: #1a1a1a; color: #FF4D8D; border: 1px solid #FF4D8D30; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; letter-spacing: 1px; white-space: nowrap; }
  .date-input { padding: 10px; background: #111; color: #fff; border: 1px solid #222; border-radius: 8px; font-size: 14px; }

  .role-row { background: #111; border: 1px solid #222; border-radius: 12px; padding: 14px; margin-bottom: 10px; position: relative; }
  .role-row.voided { opacity: 0.4; }
  .role-row.voided .role-fields input { pointer-events: none; }
  .role-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .role-name { font-size: 16px; font-weight: 700; color: #eee; }
  .role-remove { color: #FF4D8D; cursor: pointer; font-size: 18px; padding: 0 6px; background: none; border: none; }
  .void-btn { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: 1px; cursor: pointer; border: 1px solid; margin-right: 6px; }
  .void-btn.active { background: #f87171; color: #fff; border-color: #f87171; }
  .void-btn.inactive { background: transparent; color: #555; border-color: #333; }
  .void-tag { color: #f87171; font-size: 10px; font-weight: 700; letter-spacing: 2px; margin-left: 8px; }
  .result.voided { opacity: 0.35; }
  .result.voided .rperson { text-decoration: line-through; }
  .role-fields { display: flex; gap: 8px; }
  .role-field { flex: 1; text-align: center; }
  .role-field label { display: block; font-size: 9px; color: #555; letter-spacing: 2px; margin-bottom: 4px; }
  .role-field input { width: 100%; padding: 10px; background: #0a0a0a; color: #FF4D8D; border: 1px solid #222; border-radius: 8px; font-size: 18px; font-weight: 700; text-align: center; }

  .add-role { display: flex; gap: 8px; margin-top: 12px; }
  .add-role input { flex: 1; padding: 10px; background: #111; color: #fff; border: 1px solid #222; border-radius: 8px; font-size: 14px; }
  .add-role button { padding: 10px 18px; background: #FF4D8D; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .pull-hours-btn { width: 100%; padding: 12px; background: #1a1a1a; color: #34d399; border: 1px solid #34d39940; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: 1px; margin-bottom: 12px; }
  .btn-loading { pointer-events: none; opacity: 0.7; }
  .btn-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #FF4D8D40; border-top-color: #FF4D8D; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .calc-btn { width: 100%; padding: 16px; background: #FF4D8D; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; letter-spacing: 2px; cursor: pointer; margin-bottom: 12px; }
  .calc-btn:active { background: #e0437a; }

  .result { background: #111; border: 1px solid #FF4D8D20; border-radius: 12px; padding: 14px; margin-bottom: 8px; }
  .result-header { display: flex; justify-content: space-between; align-items: center; }
  .result .rname { font-size: 16px; font-weight: 700; color: #eee; }
  .result .rperson { font-size: 22px; font-weight: 800; color: #FF4D8D; }
  .result .rdetail { font-size: 11px; color: #555; margin-top: 6px; }
  .result .rdetail span { color: #777; }

  .summary { text-align: center; padding: 14px; color: #555; font-size: 12px; line-height: 1.8; }
  .summary .total-line { font-size: 14px; color: #FF4D8D; font-weight: 700; }
</style>
</head>
<body>

<div class="header"><h1>LA CASITA TIP SHEET</h1></div>
<a href="app.html" style="display:block;padding:8px;text-align:center;font-size:11px;color:#444;text-decoration:none;letter-spacing:2px;background:#050505;">← BACK TO APP</a>

<section>
  <h2>DATE</h2>
  <input type="date" class="date-input" id="sheetDate" />
</section>

<section>
  <h2>CARD TIPS</h2>
  <div class="pool-input">
    <input type="number" id="cardAmount" placeholder="0.00" step="0.01" oninput="updateTotal()" />
    <button onclick="pullPool()">PULL FROM<br/>THIS DATE</button>
  </div>
</section>

<section>
  <h2>CASH TIPS</h2>
  <div class="pool-input">
    <input type="number" id="cashAmount" placeholder="0.00" step="0.01" oninput="updateTotal()" />
  </div>
</section>

<section>
  <h2>TOTAL TIP POOL</h2>
  <div style="text-align:center;padding:10px 0;">
    <span id="totalPool" style="font-size:36px;font-weight:800;color:#FF4D8D;">$0.00</span>
    <div style="font-size:11px;color:#555;margin-top:6px;letter-spacing:1px;">
      <span id="totalBreakdown">CARD $0.00 + CASH $0.00</span>
    </div>
  </div>
  <input type="hidden" id="poolAmount" />
</section>

<section>
  <h2>ROLES</h2>
  <button class="pull-hours-btn" onclick="pullFromClockIn()">PULL HOURS FROM CLOCK-IN</button>
  <div id="rolesList"></div>
  <div class="add-role">
    <input type="text" id="newRoleName" placeholder="New role name" />
    <button onclick="addRole()">ADD ROLE</button>
  </div>
</section>

<section>
  <button class="calc-btn" onclick="calculate()">CALCULATE SPLIT</button>
  <button class="calc-btn" id="saveBtn" onclick="savePayouts()" style="display:none;background:#34d399;margin-top:8px;">SAVE TO STAFF RECORDS</button>
  <div id="results"></div>
  <div class="summary" id="summary"></div>
</section>

<script>
const SUPABASE_URL = 'https://tqeunmqnaoyrerkbhokk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxZXVubXFuYW95cmVya2Job2trIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4OTQ1MzQsImV4cCI6MjA4OTQ3MDUzNH0.hkkuc7_YE2yf0w0NQENpahAxqxxqBfjq8n5QhtTIkw8';

function updateTotal() {
  const card = parseFloat(document.getElementById('cardAmount').value) || 0;
  const cash = parseFloat(document.getElementById('cashAmount').value) || 0;
  const total = card + cash;
  document.getElementById('poolAmount').value = total.toFixed(2);
  document.getElementById('totalPool').textContent = '$' + total.toFixed(2);
  document.getElementById('totalBreakdown').textContent = 'CARD $' + card.toFixed(2) + ' + CASH $' + cash.toFixed(2);
}

let roles = JSON.parse(localStorage.getItem('lc_roles') || 'null') || [
  { name: 'Barbacks', count: 2, points: 5, hours: 10 },
  { name: 'Bartenders', count: 3, points: 8, hours: 10 },
  { name: 'Bottle Girls', count: 3, points: 8, hours: 8 },
];

function save() { localStorage.setItem('lc_roles', JSON.stringify(roles)); }

function renderRoles() {
  document.getElementById('rolesList').innerHTML = roles.map((r, i) =>
    `<div class="role-row${r.voided ? ' voided' : ''}">
      <div class="role-header">
        <span class="role-name">${r.name}${r.voided ? '<span class="void-tag">VOID</span>' : ''}</span>
        <div>
          <button class="void-btn ${r.voided ? 'active' : 'inactive'}" onclick="toggleVoid(${i})">${r.voided ? 'VOIDED' : 'VOID'}</button>
          <button class="role-remove" onclick="removeRole(${i})">x</button>
        </div>
      </div>
      <div class="role-fields">
        <div class="role-field">
          <label>STAFF</label>
          <input type="number" value="${r.count}" min="1" onchange="updateRole(${i},'count',this.value)" />
        </div>
        <div class="role-field">
          <label>POINTS</label>
          <input type="number" value="${r.points}" step="0.5" onchange="updateRole(${i},'points',this.value)" />
        </div>
        <div class="role-field">
          <label>HOURS</label>
          <input type="number" value="${r.hours}" step="0.5" onchange="updateRole(${i},'hours',this.value)" />
        </div>
      </div>
    </div>`
  ).join('');
}

function toggleVoid(i) {
  roles[i].voided = !roles[i].voided;
  save();
  renderRoles();
}

function updateRole(i, field, val) {
  roles[i][field] = parseFloat(val) || 0;
  save();
}

function removeRole(i) {
  roles.splice(i, 1);
  save();
  renderRoles();
}

function addRole() {
  const name = document.getElementById('newRoleName').value.trim();
  if (!name) return;
  roles.push({ name, count: 1, points: 1, hours: 8 });
  save();
  document.getElementById('newRoleName').value = '';
  renderRoles();
}

function calculate() {
  const pool = parseFloat(document.getElementById('poolAmount').value) || 0;
  if (!pool || !roles.length) return;

  const allRows = roles.filter(r => r.count > 0 && r.points > 0 && r.hours > 0).map(r => {
    const totalShares = r.count * r.points * r.hours;
    return { ...r, totalShares };
  });

  const activeRows = allRows.filter(r => !r.voided);
  const grandTotal = activeRows.reduce((s, r) => s + r.totalShares, 0);
  if (grandTotal === 0) return;

  let totalDistributed = 0;
  let totalStaff = 0;

  document.getElementById('results').innerHTML = allRows.map(r => {
    if (r.voided) {
      return `<div class="result voided">
        <div class="result-header">
          <div class="rname">${r.name} (${r.count}) <span class="void-tag">VOID</span></div>
          <div class="rperson">$0.00 <span style="font-size:12px;color:#666">each</span></div>
        </div>
        <div class="rdetail">
          ${r.count} staff x ${r.points} pts x ${r.hours} hrs = <span>${r.totalShares} shares (excluded)</span>
        </div>
      </div>`;
    }
    const roleTotal = Math.round(r.totalShares / grandTotal * pool * 100) / 100;
    const perPerson = Math.round(roleTotal / r.count * 100) / 100;
    totalDistributed += perPerson * r.count;
    totalStaff += r.count;
    return `<div class="result">
      <div class="result-header">
        <div class="rname">${r.name} (${r.count})</div>
        <div class="rperson">$${perPerson.toFixed(2)} <span style="font-size:12px;color:#666">each</span></div>
      </div>
      <div class="rdetail">
        ${r.count} staff x ${r.points} pts x ${r.hours} hrs = <span>${r.totalShares} shares</span>
        &middot; Role total: <span>$${roleTotal.toFixed(2)}</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('summary').innerHTML =
    `<div class="total-line">$${pool.toFixed(2)} pool / ${grandTotal} active shares = $${(pool / grandTotal).toFixed(2)} per share</div>
     ${totalStaff} staff &middot; Distributed: $${totalDistributed.toFixed(2)}`;

  window._lastCalc = { rows: activeRows, pool, grandTotal };
  document.getElementById('saveBtn').style.display = 'block';
}

async function savePayouts() {
  const calc = window._lastCalc;
  if (!calc) return;
  const date = document.getElementById('sheetDate').value;
  const payouts = [];

  for (const r of calc.rows) {
    const roleTotal = Math.round(r.totalShares / calc.grandTotal * calc.pool * 100) / 100;
    const perPerson = Math.round(roleTotal / r.count * 100) / 100;
    for (let i = 0; i < r.count; i++) {
      payouts.push({
        staff_name: r.name + ' #' + (i + 1),
        role: r.name,
        party_date: date,
        hours: r.hours,
        points: r.points,
        shares: r.points * r.hours,
        amount: perPerson,
        pool_total: calc.pool,
      });
    }
  }

  // If clock records exist, use real names
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/terminal-payment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ action: 'clock_records', party_date: date }),
    });
    const data = await res.json();
    if (data.records?.length) {
      const realPayouts = [];
      for (const r of calc.rows) {
        const roleTotal = Math.round(r.totalShares / calc.grandTotal * calc.pool * 100) / 100;
        const perPerson = Math.round(roleTotal / r.count * 100) / 100;
        // Match role name (strip trailing 's' for matching)
        const roleName = r.name.replace(/s$/, '');
        const matched = data.records.filter(cr => cr.role === roleName || cr.role === r.name);
        if (matched.length > 0) {
          for (const m of matched) {
            realPayouts.push({
              staff_name: m.name,
              role: m.role,
              party_date: date,
              hours: m.hours || r.hours,
              points: r.points,
              shares: r.points * (m.hours || r.hours),
              amount: perPerson,
              pool_total: calc.pool,
            });
          }
        } else {
          for (let i = 0; i < r.count; i++) {
            realPayouts.push({
              staff_name: r.name + ' #' + (i + 1),
              role: r.name,
              party_date: date,
              hours: r.hours,
              points: r.points,
              shares: r.points * r.hours,
              amount: perPerson,
              pool_total: calc.pool,
            });
          }
        }
      }
      payouts.length = 0;
      payouts.push(...realPayouts);
    }
  } catch {}

  const res = await fetch(`${SUPABASE_URL}/functions/v1/terminal-payment`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
    body: JSON.stringify({ action: 'save_payouts', payouts }),
  });
  const result = await res.json();
  if (result.success) {
    document.getElementById('saveBtn').textContent = 'SAVED ' + result.count + ' RECORDS';
    document.getElementById('saveBtn').disabled = true;
  }
}

async function pullPool() {
  const btn = document.querySelector('.pool-input button');
  btn.classList.add('btn-loading');
  btn.innerHTML = '<span class="btn-spinner"></span>LOADING...';
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/terminal-payment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ action: 'tips' }),
    });
    const data = await res.json();
    if (data.payments) {
      const dateStr = document.getElementById('sheetDate').value;
      const cutoff = new Date(dateStr + 'T04:00:00');
      const cutoffEnd = new Date(cutoff);
      cutoffEnd.setDate(cutoffEnd.getDate() + 1);
      const todays = data.payments.filter(p => {
        const t = new Date(new Date(p.created * 1000).toLocaleString('en-US', { timeZone: 'America/New_York' }));
        return t >= cutoff && t < cutoffEnd;
      });
      const service = todays.reduce((s, p) => s + p.service_charge, 0);
      const tips = todays.reduce((s, p) => s + p.tip, 0);
      document.getElementById('cardAmount').value = ((service + tips) / 100).toFixed(2);
      updateTotal();
    }
  } catch {}
  btn.classList.remove('btn-loading');
  btn.innerHTML = 'PULL FROM<br/>THIS DATE';
}

function getPartyDate() {
  const nowET = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  if (nowET.getHours() < 4) nowET.setDate(nowET.getDate() - 1);
  const yyyy = nowET.getFullYear();
  const mm = String(nowET.getMonth() + 1).padStart(2, '0');
  const dd = String(nowET.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

document.getElementById('sheetDate').value = getPartyDate();

const ROLE_POINTS = JSON.parse(localStorage.getItem('lc_role_points') || 'null') || {
  'Barback': 5, 'Bartender': 8, 'Bottle Girl': 8,
  'Security': 3, 'DJ': 5, 'Host': 3, 'Manager': 8, 'Server': 5,
};
function saveRolePoints() { localStorage.setItem('lc_role_points', JSON.stringify(ROLE_POINTS)); }

async function pullFromClockIn() {
  const date = document.getElementById('sheetDate').value;
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/terminal-payment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ action: 'clock_records', party_date: date }),
    });
    const data = await res.json();
    if (!data.records?.length) { alert('No clock-in records for ' + date); return; }

    // Group by role, average hours per role
    const byRole = {};
    for (const r of data.records) {
      if (!byRole[r.role]) byRole[r.role] = { count: 0, totalHours: 0 };
      byRole[r.role].count++;
      const hrs = r.hours ? parseFloat(r.hours) : 0;
      byRole[r.role].totalHours += hrs;
    }

    roles = Object.entries(byRole).map(([name, info]) => ({
      name: name + 's',
      count: info.count,
      points: ROLE_POINTS[name] || 5,
      hours: info.count > 0 ? Math.round(info.totalHours / info.count * 2) / 2 : 0,
    }));

    save();
    renderRoles();
  } catch (e) { alert('Error loading clock records'); }
}

renderRoles();
</script>
</body>
</html>
